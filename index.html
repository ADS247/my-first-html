<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My first page</title>
     <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        h2 {
            text-align: center;
            font-size: 30px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        
        section {
            width: 80%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        fieldset {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: white;
        }
        
        legend {
            font-weight: bold;
            font-size: 18px;
            padding: 0 10px;
            color: #333;
        }
        
        label {
            display: block;
            margin: 10px 0;
            padding: 8px;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        label:hover {
            background-color: #f0f0f0;
        }
        
        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 10px;
            transform: scale(1.2);
        }
        
        input[type="email"] {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            color: #666;
            font-size: 14px;
        }
        
        p {
            text-align: center;
            line-height: 1.6;
            margin: 15px 0;
        }
        
        #date, #update-time {
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>
<h1>Welcome</h1>
<p>This is my first HTML document on GitHub</p>
<p>Today is: <span id="date">loading date...</span></p>
<script>
    document.getElementById('date').textContent = new Date().toLocaleDateString();
</script>
<section>
    <h2>My learning form</h2>
    <form>
        <fieldset>
            <legend>What have you learned today?</legend>
            <label><input type="checkbox" name="learned" value="html">HTML Forms</label>
            <label><input type="checkbox" name="learned" value="css">CSS Basics</label>
            <label><input type="checkbox" name="learned" value="git">Git Commands</label>
        </fieldset>
        <fieldset>
            <legend>How many hours did you study?</legend>
            <label><input type="radio" name="hours" value="1-2">1-2 hours</label>
            <label><input type="radio" name="hours" value="3-4">3-4 hours</label>
            <label><input type="radio" name="hours" value="5 or more">5 or more</label>
        </fieldset>
        
        <input type="email" placeholder="Your email for updates" required>
        <button type="submit">Save Progress</button>
    </form>
</section>
<footer>
    <p>Page updated at: <span id="update-time">calculating...</span></p>
</footer>
<script>
    document.getElementById('update-time').textContent = new Date().toLocaleTimeString();
</script>
</body>
</html>
